<div class="login-wrapper">
  <div class="login-card">
    <h1 class="login-title">DaPokedex</h1>
    <p class="login-subtitle">{{ isRegister() ? 'Crea tu cuenta' : 'Inicia sesión' }}</p>

    @if (errorMessage()) {
      <p class="error-message" role="alert">{{ errorMessage() }}</p>
    }
    @if (infoMessage()) {
      <p class="info-message" role="status">{{ infoMessage() }}</p>
    }

    <form (ngSubmit)="submitForm()">
      <div class="form-group">
        <label for="email">Email</label>
        <input
          id="email"
          type="email"
          [(ngModel)]="email"
          name="email"
          placeholder="tu@email.com"
          autocomplete="email"
          required
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <div class="password-field">
          <input
            id="password"
            [type]="showPassword() ? 'text' : 'password'"
            [(ngModel)]="password"
            name="password"
            placeholder="••••••••"
            [attr.autocomplete]="isRegister() ? 'new-password' : 'current-password'"
            [attr.minlength]="isRegister() ? 6 : null"
            required
          />
          <button
            type="button"
            class="toggle-password"
            (click)="showPassword.update((v) => !v)"
            [attr.aria-label]="showPassword() ? 'Ocultar contraseña' : 'Mostrar contraseña'"
          >
            {{ showPassword() ? 'Ocultar' : 'Mostrar' }}
          </button>
        </div>
        @if (!isRegister()) {
          <button type="button" class="forgot-password" (click)="resetPassword()">
            ¿Olvidaste tu contraseña?
          </button>
        }
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        @if (isLoading()) {
          Cargando...
        } @else {
          {{ isRegister() ? 'Registrarse' : 'Iniciar sesión' }}
        }
      </button>
    </form>

    <div class="divider">
      <span>o</span>
    </div>

    <button class="btn-google" (click)="loginWithGoogle()" [disabled]="isLoading()">
      <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" alt="" />
      Continuar con Google
    </button>

    <p class="toggle-mode">
      {{ isRegister() ? '¿Ya tienes cuenta?' : '¿No tienes cuenta?' }}
      <button type="button" class="toggle-mode__btn" (click)="toggleMode()">
        {{ isRegister() ? 'Inicia sesión' : 'Regístrate' }}
      </button>
    </p>
  </div>
</div>
