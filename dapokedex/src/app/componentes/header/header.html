<header class="sistema">
  <a class="marca" routerLink="/" aria-label="Dapokedex, ir a las cajas">
    <img src="logo.png" alt="Dapokedex" width="200" height="40" />
  </a>

  <nav class="nav" aria-label="Secciones">
    @for (s of sections; track s.path; let i = $index) {
      <a
        [routerLink]="s.path"
        [attr.aria-current]="activeIndex() === i ? 'page' : null"
        [attr.aria-keyshortcuts]="'' + (i + 1)"
      >
        <span class="nav__tecla" aria-hidden="true">{{ i + 1 }}</span
        >{{ s.label }}
      </a>
    }
  </nav>

  <div class="sistema__derecha">
    <button
      class="sistema__boton"
      (click)="keyboard.helpOpen.set(true)"
      aria-label="Ver controles de teclado"
    >
      <kbd>?</kbd> Controles
    </button>
    @if (authReady() && !user()) {
      <a class="sistema__boton sistema__boton--fuerte" routerLink="/login">Entrar</a>
    } @else {
      <a
        class="sistema__boton sistema__boton--amigos"
        routerLink="/amigos"
        [attr.aria-label]="
          pending() > 0 ? 'Amigos, ' + pending() + ' solicitudes pendientes' : 'Amigos'
        "
      >
        Amigos
        @if (pending() > 0) {
          <span class="sistema__aviso" aria-hidden="true">{{ pending() }}</span>
        }
      </a>
      <a class="sistema__boton" routerLink="/account" aria-label="Mi cuenta">Cuenta</a>
    }
  </div>
</header>

<!-- Barra de navegación inferior mobile -->
<nav class="mobile-nav">

    routerLink="/"
    routerLinkActive="mobile-nav-item--active"

      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
      <polyline points="9 22 9 12 15 12 15 22" />
    </svg>
    <span>Cajas</span>
  </a>

  <a class="mobile-nav-item" routerLink="/tipo/fire" [class.mobile-nav-item--active]="inTypes()">

      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"

  <a class="mobile-nav-item" routerLink="/comparar" routerLinkActive="mobile-nav-item--active">

      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"

      stroke-width="2"

      stroke-linejoin="round"
    >

      <path d="M5 7h14" />
      <path d="M5 7l-3 7a3 3 0 0 0 6 0z" />
      <path d="M19 7l-3 7a3 3 0 0 0 6 0z" />
    </svg>
    <span>Comparar</span>
  </a>

  <a class="mobile-nav-item" routerLink="/game" routerLinkActive="mobile-nav-item--active">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <circle cx="12" cy="12" r="10" />
      <line x1="12" y1="8" x2="12" y2="16" />
      <line x1="8" y1="12" x2="16" y2="12" />
    </svg>
    <span>Juego</span>
  </a>

  <a class="mobile-nav-item" routerLink="/collection" routerLinkActive="mobile-nav-item--active">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <rect x="3" y="3" width="7" height="7" />
      <rect x="14" y="3" width="7" height="7" />
      <rect x="14" y="14" width="7" height="7" />
      <rect x="3" y="14" width="7" height="7" />
    </svg>
    <span>Colección</span>
  </a>

  <a class="mobile-nav-item" routerLink="/account" routerLinkActive="mobile-nav-item--active">
    <svg
      xmlns="http://www.w3.org/2000/svg"
      width="22"
      height="22"
      viewBox="0 0 24 24"
      fill="none"
      stroke="currentColor"
      stroke-width="2"
      stroke-linecap="round"
      stroke-linejoin="round"
    >
      <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2" />
      <circle cx="12" cy="7" r="4" />
    </svg>
    <span>Cuenta</span>

</nav>
